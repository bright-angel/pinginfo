[project]
name = "pinginfo"
version = "1.0.0"
description = "图形化批量 Ping 工具，支持 IPv4/IPv6、域名、网段、范围和通配符"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "pinginfo" },
]
keywords = ["ping", "icmp", "network", "tkinter", "ipv6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.urls]
Documentation = "README.md"

[project.scripts]
pinginfo = "pinginfo.cli:main"

[project.gui-scripts]
pinginfo-gui = "pinginfo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.uv]
package = true
